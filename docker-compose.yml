services:
  haflow-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: haflow-website:latest
    container_name: haflow-website
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - haflow_leads:/app/data/leads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - haflow_net
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 100M
    environment:
      - NODE_ENV=production
      - PORT=3000

volumes:
  haflow_leads:

networks:
  haflow_net:
    name: ${DOCKER_PROXY_NETWORK:-haflow_net}
    external: true

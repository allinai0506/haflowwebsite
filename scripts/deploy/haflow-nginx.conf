# haflow-website Nginx 虚拟主机配置（生产反向代理模板）
# 注意：在 http {} 块中需先定义限流区域：
# limit_req_zone $binary_remote_addr zone=haflow_diagnose:10m rate=5r/m;

upstream haflow_upstream {
    # 容器化部署模式（同一 Docker bridge 网络）
    server haflow-website:3000;
    # 若采用宿主机 PM2 部署模式，请切换为本地回环地址：
    # server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP (Port 80) ----------
server {
    listen 80;
    server_name haflow.cn www.haflow.cn;
    server_tokens off;

    access_log /var/log/nginx/haflow-access.log main;
    error_log /var/log/nginx/haflow-error.log warn;

    # Let's Encrypt ACME HTTP-01 验证（certbot webroot 模式）
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # 阻断隐藏文件与内部数据路径
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ^~ /data/ {
        deny all;
        return 404;
    }

    # SSL 证书就绪后，全站 301 重定向至 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (Port 443) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name haflow.cn www.haflow.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/haflow.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haflow.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    access_log /var/log/nginx/haflow-ssl-access.log main;
    error_log /var/log/nginx/haflow-ssl-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # 阻断隐藏文件（如 .env / .git）与任何 /data/ 路径
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ^~ /data/ {
        deny all;
        return 404;
    }

    # 业务线索接口：严格请求体大小与频率限制（配合应用层限流）
    location = /api/diagnose {
        limit_req zone=haflow_diagnose burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;

        proxy_pass http://haflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # 静态资源长缓存（Next content-hash；重申安全头防止 Nginx add_header 继承丢失）
    location /_next/static/ {
        proxy_pass http://haflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /sitemap.xml {
        proxy_pass http://haflow_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://haflow_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://haflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }
}

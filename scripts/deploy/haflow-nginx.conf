# haflow-website Nginx 虚拟主机配置（部署在 115.190.237.184）
# 挂载并在 nexus-frontend 容器中生效

upstream haflow_upstream {
    # 容器化部署模式（推荐，与 nexus-frontend 处于同一 nexusarchive_default 网络）
    server haflow-website:3000;
    # 若采用宿主机 PM2 部署模式，请切换为宿主机 Docker 网关地址：
    # server 172.18.0.1:3000;
    keepalive 32;
}

# ---------- HTTP (Port 80) ----------
server {
    listen 80;
    server_name haflow.cn www.haflow.cn;

    access_log /var/log/nginx/haflow-access.log main;
    error_log /var/log/nginx/haflow-error.log warn;

    # Let's Encrypt ACME HTTP-01 验证（certbot webroot 模式）
    # 容器内 /usr/share/nginx/html 映射自宿主机 /opt/nexusarchive/frontend
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    # 阶段一（证书申请与初次验证阶段）：直接反向代理，用于通过 hosts 验证 HTTP
    location / {
        proxy_pass http://haflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # 阶段二（SSL 证书颁发完成后开启）：全站 301 重定向至 HTTPS
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

